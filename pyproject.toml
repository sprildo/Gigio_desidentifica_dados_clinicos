[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pt-gigio-desidentifica-tools"
version = "1.1.0"
description = "De-identification pipeline for Brazilian Portuguese clinical text"
requires-python = ">=3.11,<3.12"
dependencies = [
    "spacy>=3.8.14,<3.9.0",
]

[project.optional-dependencies]
annotation = [
    # Prodigy exige licença paga (https://prodi.gy) — não está no PyPI público.
    # Prodigy requires licence
    # Instale separadamente: pip install prodigy -f https://SEU-TOKEN@download.prodi.gy
    # Install separately
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
pythonpath = ["."]
